name: Lint

on:
    push:
        branches: [main]
        paths:
            - '.github/workflows/**'
            - 'scripts/**'
            - 'tests/**'
            - 'src/**'
            - 'bin/**'
            - 'composer.json'
            - 'composer.lock'
    # No path filter on pull requests. A required actionlint check would never
    # report on a workflow skipped by a path filter, so a docs-only PR would
    # wait on it forever.
    pull_request:

# Development happens on github.a8c.com, so these jobs run there only. github.com
# receives each release as a direct push and never runs them.
#
# github.a8c.com runs jobs on SecEx runners, which drop outbound traffic to any
# host not listed here. The runner reads this before the job starts, so it must
# be a literal. The list covers the actionlint download, apt for bats and
# shellcheck, setup-php's PHP and PPA downloads, and Composer and Packagist.
env:
    SECEX_EGRESS_RULES: 'github.a8c.com,*.github.a8c.com,github.com,*.github.com,*.githubusercontent.com,packagist.org,*.packagist.org,getcomposer.org,setup-php.com,ppa.setup-php.com,cdn.jsdelivr.net,ppa.launchpadcontent.net,launchpad.net,*.launchpad.net,keyserver.ubuntu.com,archive.ubuntu.com,security.ubuntu.com'

jobs:
    actionlint:
        name: actionlint
        if: github.server_url != 'https://github.com'
        runs-on: [self-hosted, secex, gha-runner-1cpu-1gb]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Download actionlint
              id: get_actionlint
              # actionlint v1.7.12
              run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash)
              shell: bash
            - name: Check workflow files
              run: ${{ steps.get_actionlint.outputs.executable }} -color
              shell: bash

    shellcheck:
        name: shellcheck
        if: github.server_url != 'https://github.com'
        runs-on: [self-hosted, secex, gha-runner-1cpu-1gb]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Check shell scripts
              # find keeps the coverage recursive to match the scripts/**
              # trigger paths; -exec {} + propagates shellcheck's exit status.
              # Stubs are swept as a directory so a newly added one cannot go
              # unlinted.
              run: |
                  command -v shellcheck >/dev/null || { sudo apt-get update && sudo apt-get install -y shellcheck; }
                  find scripts -type f -name '*.sh' -exec shellcheck --severity=warning {} +
                  find tests/stubs -type f -exec shellcheck --severity=warning {} +
                  shellcheck --severity=warning tests/*.bash
              shell: bash

    bats:
        name: bats
        if: github.server_url != 'https://github.com'
        runs-on: [self-hosted, secex, gha-runner-1cpu-1gb]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Install bats
              run: sudo apt-get update && sudo apt-get install -y bats
            - name: Run tests
              run: |
                  command -v jq >/dev/null || sudo apt-get install -y jq
                  bats tests/
              shell: bash

    php:
        name: php ${{ matrix.php }}
        if: github.server_url != 'https://github.com'
        runs-on: [self-hosted, secex, gha-runner-2cpu-4gb]
        strategy:
            fail-fast: false
            matrix:
                # The floor declared in composer.json, and the newest stable.
                # CI proves the version operators are told they need.
                php: ['8.2', '8.4']
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            # v2.37.2, the newest release proven to install PHP on SecEx.
            - uses: third-party-actions/shivammathur-setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
              with:
                  php-version: ${{ matrix.php }}
                  extensions: json, mbstring, phar
                  coverage: none
                  # Box compiles the PHAR, which a read-only phar ini forbids.
                  ini-values: phar.readonly=0
            - name: Validate composer.json
              run: composer validate --strict
            - name: Install dependencies
              run: composer install --no-interaction --no-progress --prefer-dist
            - name: Check code style
              run: vendor/bin/php-cs-fixer fix --dry-run --diff
            - name: Static analysis
              run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M
            - name: Run tests
              run: vendor/bin/pest
            - name: Build the PHAR
              # The packaged artefact is what operators run, so build it on
              # every PR. A dependency whose non-PHP resources fall outside
              # the Box finder only fails here, never in the test suite.
              run: vendor/bin/box compile
            - name: Check the PHAR runs
              run: |
                  ./bin/dependabot-directories.phar acme/widgets \
                      --paths-from-file tests/Fixtures/trees/mixed-monorepo.paths \
                      --detect-only \
                      | diff - tests/Fixtures/golden/detect-mixed-monorepo.txt
              shell: bash
