name: Lint

on:
    push:
        branches: [main]
        paths:
            - '.github/workflows/**'
            - 'scripts/**'
            - 'tests/**'
            - 'src/**'
            - 'bin/**'
            - 'composer.json'
            - 'composer.lock'
    pull_request:
        paths:
            - '.github/workflows/**'
            - 'scripts/**'
            - 'tests/**'
            - 'src/**'
            - 'bin/**'
            - 'composer.json'
            - 'composer.lock'

jobs:
    actionlint:
        name: actionlint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - name: Download actionlint
              id: get_actionlint
              # actionlint v1.7.12
              run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash)
              shell: bash
            - name: Check workflow files
              run: ${{ steps.get_actionlint.outputs.executable }} -color
              shell: bash

    shellcheck:
        name: shellcheck
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - name: Check shell scripts
              # shellcheck is preinstalled on ubuntu-latest. find keeps the
              # coverage recursive to match the scripts/** trigger paths;
              # -exec {} + propagates shellcheck's exit status. Stubs are swept
              # as a directory so a newly added one cannot go unlinted.
              run: |
                  find scripts -type f -name '*.sh' -exec shellcheck --severity=warning {} +
                  find tests/stubs -type f -exec shellcheck --severity=warning {} +
              shell: bash

    bats:
        name: bats
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - name: Install bats
              run: sudo apt-get update && sudo apt-get install -y bats
            - name: Run tests
              # jq is preinstalled on ubuntu-latest
              run: bats tests/
              shell: bash

    php:
        name: php ${{ matrix.php }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # The floor declared in composer.json, and the newest stable.
                # CI proves the version operators are told they need.
                php: ['8.2', '8.4']
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: json, mbstring, phar
                  coverage: none
                  # Box compiles the PHAR, which a read-only phar ini forbids.
                  ini-values: phar.readonly=0
            - name: Validate composer.json
              run: composer validate --strict
            - name: Install dependencies
              run: composer install --no-interaction --no-progress --prefer-dist
            - name: Check code style
              run: vendor/bin/php-cs-fixer fix --dry-run --diff
            - name: Static analysis
              run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M
            - name: Run tests
              run: vendor/bin/pest
            - name: Build the PHAR
              # The packaged artefact is what operators run, so build it on
              # every PR. A dependency whose non-PHP resources fall outside
              # the Box finder only fails here, never in the test suite.
              run: vendor/bin/box compile
            - name: Check the PHAR runs
              run: |
                  ./bin/dependabot-directories.phar acme/widgets \
                      --paths-from-file tests/Fixtures/trees/mixed-monorepo.paths \
                      --detect-only \
                      | diff - tests/Fixtures/golden/detect-mixed-monorepo.txt
              shell: bash
