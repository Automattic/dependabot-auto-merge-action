name: Lint

on:
    push:
        branches: [main]
        paths:
            - '.github/workflows/**'
            - 'scripts/**'
            - 'tests/**'
            - 'cmd/**'
            - 'go.mod'
            - 'go.sum'
    pull_request:
        paths:
            - '.github/workflows/**'
            - 'scripts/**'
            - 'tests/**'
            - 'cmd/**'
            - 'go.mod'
            - 'go.sum'

jobs:
    actionlint:
        name: actionlint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - name: Download actionlint
              id: get_actionlint
              # actionlint v1.7.12
              run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash)
              shell: bash
            - name: Check workflow files
              run: ${{ steps.get_actionlint.outputs.executable }} -color
              shell: bash

    shellcheck:
        name: shellcheck
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - name: Check shell scripts
              # shellcheck is preinstalled on ubuntu-latest. find keeps the
              # coverage recursive to match the scripts/** trigger paths;
              # -exec {} + propagates shellcheck's exit status. Stubs are swept
              # as a directory so a newly added one cannot go unlinted.
              run: |
                  find scripts -type f -name '*.sh' -exec shellcheck --severity=warning {} +
                  find tests/stubs -type f -exec shellcheck --severity=warning {} +
              shell: bash

    bats:
        name: bats
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - name: Install bats
              run: sudo apt-get update && sudo apt-get install -y bats
            - name: Run tests
              # jq is preinstalled on ubuntu-latest
              run: bats tests/
              shell: bash

    go:
        name: go
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  # The floor declared in go.mod, not whatever is newest —
                  # CI proves the version operators are told they need.
                  go-version-file: go.mod
            - name: gofmt
              # gofmt -l . walks every Go file in the module, so a package
              # added later is covered without editing this list.
              run: |
                  unformatted=$(gofmt -l .)
                  [ -z "$unformatted" ] || { printf 'gofmt needed on:\n%s\n' "$unformatted"; exit 1; }
              shell: bash
            - name: go vet
              run: go vet ./...
            - name: go test
              run: go test ./...
