name: Dependabot auto-merge

on:
    workflow_call:
        secrets:
            token:
                description: 'Token that can read Dependabot alerts, used by the fetch-metadata alert lookup (which also lists the PR commits) and the Gate 1 fallback. Pass a PAT or fine-grained token with Dependabot alerts read and Pull requests read when GITHUB_TOKEN lacks access. Defaults to GITHUB_TOKEN.'
                required: false
        inputs:
            event-name:
                description: 'Pass github.event_name from the caller workflow so jobs can route correctly.'
                type: string
                required: true
            cvss-threshold:
                description: 'Minimum CVSS score to qualify for auto-merge (Gate 2). Float string, e.g. "7.0".'
                type: string
                default: '7.0'
            compatibility-threshold:
                description: 'Minimum Dependabot compatibility score % for direct dependencies (Gate 3).'
                type: number
                default: 80
            age-days:
                description: 'Minimum days a PR must be open before the scheduled job merges it.'
                type: number
                default: 7
            merge-method:
                description: 'Merge strategy passed to gh pr merge: squash, merge, or rebase.'
                type: string
                default: 'squash'
            fast-track-label:
                description: 'Label that bypasses all gates and enables immediate auto-merge.'
                type: string
                default: 'security-fast-track'
            review-label:
                description: 'Label applied to PRs that fail a gate and need human review.'
                type: string
                default: 'sirt-review-required'
            pending-label:
                description: 'Label applied to PRs that passed all gates and are awaiting the age gate.'
                type: string
                default: 'auto-merge-pending'
            review-team:
                description: 'Optional GitHub team slug (org/team) to @-mention in review-required comments.'
                type: string
                default: ''

permissions:
    pull-requests: write
    contents: write
    security-events: read
    # evaluate-pr records its verdict as a commit status, and the scheduled
    # merge reads it back. Labels cannot carry that verdict: a triage user
    # can change them.
    statuses: write

jobs:
    # Verifies the repo is actually configured for auto-merge before either
    # merge path runs. `gh pr merge --auto` fails (or silently never queues)
    # when "Allow auto-merge" is off or the default branch has no required
    # status checks — fail fast here with actionable errors instead.
    #
    # Same event filter as evaluate-pr, so an event that evaluate-pr ignores
    # does not spend a preflight run either.
    preflight:
        name: Preflight — repo auto-merge configuration
        runs-on: ubuntu-latest
        if: |
            inputs.event-name == 'schedule' ||
            (inputs.event-name == 'pull_request_target' &&
             github.event.pull_request.user.login == 'dependabot[bot]' &&
             (github.event.action != 'unlabeled' || github.event.label.name == inputs.fast-track-label))
        steps:
            - name: Check auto-merge setting and required status checks
              run: |
                  FAIL=0
                  DOCS="https://github.com/Automattic/dependabot-auto-merge-action#usage"

                  # --- Check 1: "Allow auto-merge" repo setting ---------------
                  # allow_auto_merge is only returned to tokens with push
                  # access, so distinguish false (misconfigured) from absent
                  # (unverifiable). The same call yields the default branch.
                  if ! REPO_JSON=$(gh api "repos/$GITHUB_REPOSITORY" 2>&1); then
                      echo "::error::Preflight: cannot read repository metadata — $(echo "$REPO_JSON" | head -c 300 | tr '\n' ' ')"
                      exit 1
                  fi

                  ALLOW_AUTO_MERGE=$(echo "$REPO_JSON" | jq -r 'if .allow_auto_merge == true then "true" elif .allow_auto_merge == false then "false" else "unknown" end')
                  DEFAULT_BRANCH=$(echo "$REPO_JSON" | jq -r '.default_branch')

                  case "$ALLOW_AUTO_MERGE" in
                      true)
                          echo "OK: 'Allow auto-merge' is enabled on $GITHUB_REPOSITORY."
                          ;;
                      false)
                          echo "::error::Preflight: 'Allow auto-merge' is disabled on $GITHUB_REPOSITORY, so gh pr merge --auto cannot work. Enable it under Settings → General → Pull Requests → Allow auto-merge. Setup docs: $DOCS (section '4. Enable auto-merge on the repo (manual alternative)')."
                          FAIL=1
                          ;;
                      *)
                          echo "::warning::Preflight: this token cannot see the 'Allow auto-merge' setting (requires push access) — skipping the check. If auto-merge fails later, verify Settings → General → Pull Requests → Allow auto-merge."
                          ;;
                  esac

                  # --- Check 2: required status checks on the default branch --
                  # Rulesets are readable with contents: read — the recommended
                  # path — so they are checked first.
                  ENC_BRANCH=$(printf '%s' "$DEFAULT_BRANCH" | jq -sRr '@uri')

                  RULESET_CHECKS=0
                  if RULES_JSON=$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/$ENC_BRANCH?per_page=100" 2>&1); then
                      RULESET_CHECKS=$(echo "$RULES_JSON" | jq '[.[] | select(.type == "required_status_checks")] | length' 2>/dev/null || echo 0)
                  else
                      echo "::warning::Preflight: could not read branch rulesets — $(echo "$RULES_JSON" | head -c 300 | tr '\n' ' '). Falling back to classic branch protection check."
                  fi

                  if [ "$RULESET_CHECKS" -gt 0 ]; then
                      echo "OK: default branch '$DEFAULT_BRANCH' has $RULESET_CHECKS ruleset-based required status check rule(s)."
                  else
                      # No ruleset checks — check classic branch protection.
                      # .protected is readable without admin; the /protection
                      # detail endpoint is admin-only, so an error there while
                      # the branch IS protected means "cannot verify checks",
                      # not "no checks" → warn and continue.
                      if BRANCH_JSON=$(gh api "repos/$GITHUB_REPOSITORY/branches/$ENC_BRANCH" 2>&1); then
                          PROTECTED=$(echo "$BRANCH_JSON" | jq -r '.protected // false')
                      else
                          echo "::warning::Preflight: could not read default branch info — $(echo "$BRANCH_JSON" | head -c 300 | tr '\n' ' '). Skipping the required status checks verification."
                          PROTECTED="unknown"
                      fi

                      if [ "$PROTECTED" = "true" ]; then
                          if PROT_JSON=$(gh api "repos/$GITHUB_REPOSITORY/branches/$ENC_BRANCH/protection" 2>&1); then
                              HAS_CHECKS=$(echo "$PROT_JSON" | jq '.required_status_checks != null')
                              if [ "$HAS_CHECKS" = "true" ]; then
                                  echo "OK: classic branch protection on '$DEFAULT_BRANCH' requires status checks."
                              else
                                  echo "::error::Preflight: branch protection on '$DEFAULT_BRANCH' has no required status checks, so GitHub will never queue an auto-merge. Add at least one required status check via a ruleset (Settings → Rules → Rulesets) or the branch protection rule (Settings → Branches). Setup docs: $DOCS (section '5. Branch protection (manual alternative)')."
                                  FAIL=1
                              fi
                          else
                              echo "::warning::Preflight: '$DEFAULT_BRANCH' has classic branch protection, but this token cannot read its details (endpoint requires admin). Assuming required status checks are configured — auto-merge will fail later if they are not. Consider migrating to rulesets, which this check can verify."
                          fi
                      elif [ "$PROTECTED" = "false" ]; then
                          echo "::error::Preflight: default branch '$DEFAULT_BRANCH' has no ruleset-based required status checks and no classic branch protection rule. gh pr merge --auto needs at least one required status check to queue against. Add one via a ruleset (Settings → Rules → Rulesets, recommended) or classic branch protection (Settings → Branches). Setup docs: $DOCS (section '5. Branch protection (manual alternative)')."
                          FAIL=1
                      fi
                  fi

                  exit "$FAIL"
              env:
                  GH_TOKEN: ${{ github.token }}

    # Runs on every Dependabot PR event. Checks eligibility gates and labels
    # the PR accordingly. The age gate is handled by the scheduled job below.
    #
    # Removing a label matters only when it withdraws the fast-track
    # override, so other `unlabeled` events are ignored. `==` in an
    # expression ignores case, like every other label comparison here.
    evaluate-pr:
        name: Evaluate security PR eligibility
        runs-on: ubuntu-latest
        needs: preflight
        if: |
            inputs.event-name == 'pull_request_target' &&
            github.event.pull_request.user.login == 'dependabot[bot]' &&
            (github.event.action != 'unlabeled' || github.event.label.name == inputs.fast-track-label)
        # One evaluation per PR at a time, so a run that withdraws evidence
        # and disables auto-merge is never interleaved with one that grants
        # them. Not cancel-in-progress, because cancelling a run part-way
        # could stop it before it withdraws. A newer event waits, and
        # GitHub keeps only the newest waiting run, which carries the latest
        # payload.
        concurrency:
            group: dependabot-auto-merge-evaluate-pr-${{ github.event.pull_request.number }}
            cancel-in-progress: false
        steps:
            - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
              id: meta
              # Both lookups are opt-in. Without them ghsa-id and cvss stay
              # empty and every compatibility score reads 0, so Gate 1 never
              # sees an advisory and Gate 3 never sees a score. The alert
              # lookup reads Dependabot alerts, so it takes the same token as
              # the fallback. fetch-metadata fails the step when that token
              # cannot read them.
              with:
                  alert-lookup: true
                  compat-lookup: true
                  github-token: ${{ secrets.token || github.token }}

            # The fast-track label bypasses every gate, but applying a label
            # only takes triage, while enabling auto-merge takes write. So the
            # label counts only when the user who most recently applied it
            # could have merged the PR themselves. The running event cannot
            # say who that was: on a `synchronize` the sender is Dependabot,
            # and a label applied long ago rides along on every later event.
            # The issue events API records each application with its actor.
            #
            # Every failure refuses the override. The step itself still
            # succeeds, so the fast-track step is skipped and the PR falls
            # through to the normal gates, as if the label were absent.
            - name: Fast-track authorization check
              id: fast-track-auth
              if: contains(github.event.pull_request.labels.*.name, inputs.fast-track-label)
              # Explicit so the step runs under `-e -o pipefail` and the bats
              # suite can drive the extracted script with exactly these flags.
              shell: bash
              run: |
                  refuse() {
                      echo "::warning::Fast-track override refused: $1 Falling through to the normal gates."
                      echo "authorized=false" >> "$GITHUB_OUTPUT"
                      exit 0
                  }

                  if ! EVENTS=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/events?per_page=100" 2>&1); then
                      refuse "cannot read the label history. $(echo "$EVENTS" | head -c 300 | tr '\n' ' ')"
                  fi

                  # Latest labeled or unlabeled event for this label, sorted
                  # rather than taken in response order. An unlabeled event
                  # there means the label came off after this event fired.
                  # Label names compare case-insensitively, as everywhere else
                  # in this workflow.
                  if ! LATEST=$(echo "$EVENTS" | jq -c --arg label "$FAST_TRACK_LABEL" '
                      [.[][]
                       | select(.event == "labeled" or .event == "unlabeled")
                       | select((.label.name // "" | ascii_downcase) == ($label | ascii_downcase))]
                      | sort_by(.created_at, .id) | last
                      | {event: (.event // ""), actor: (.actor.login // "")}' 2>&1); then
                      refuse "cannot parse the label history."
                  fi

                  EVENT=$(echo "$LATEST" | jq -r '.event')
                  ACTOR=$(echo "$LATEST" | jq -r '.actor')
                  if [ "$EVENT" != "labeled" ] || [ -z "$ACTOR" ]; then
                      refuse "no current application of the $FAST_TRACK_LABEL label was found in the PR's history."
                  fi

                  # A login that is not a collaborator, bots among them,
                  # comes back as "none", and one that is not a user at all
                  # answers 404. Both refuse. `permission` maps maintain to
                  # write and triage to read, so write and admin are exactly
                  # the roles that can merge.
                  ENC_ACTOR=$(jq -rn --arg a "$ACTOR" '$a | @uri')
                  if ! PERMISSION=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ENC_ACTOR/permission" 2>&1); then
                      refuse "cannot read the repository permission of @$ACTOR, who applied the label. $(echo "$PERMISSION" | head -c 300 | tr '\n' ' ')"
                  fi
                  LEVEL=$(echo "$PERMISSION" | jq -r '.permission // ""' 2>/dev/null || true)
                  ROLE=$(echo "$PERMISSION" | jq -r '.role_name // ""' 2>/dev/null || true)

                  case "$LEVEL" in
                      admin | write)
                          echo "authorized=true" >> "$GITHUB_OUTPUT"
                          echo "applied-by=$ACTOR" >> "$GITHUB_OUTPUT"
                          echo "role=${ROLE:-$LEVEL}" >> "$GITHUB_OUTPUT"
                          echo "The $FAST_TRACK_LABEL label was applied by @$ACTOR (${ROLE:-$LEVEL}), who can merge."
                          ;;
                      *)
                          refuse "@$ACTOR applied the $FAST_TRACK_LABEL label but has the '${ROLE:-${LEVEL:-unknown}}' role, and only write, maintain or admin can authorize a merge."
                          ;;
                  esac
              env:
                  FAST_TRACK_LABEL: ${{ inputs.fast-track-label }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # Human override: a reviewer who can merge has verified this is a
            # legitimate security fix. Bypass all automated gates and enable
            # auto-merge immediately. Pinned to the head this event carried:
            # a commit pushed since was not part of this evaluation, so
            # GitHub refuses the merge and that push's own event decides.
            - name: Fast-track — human-verified override (bypasses all gates)
              id: fast-track
              if: steps.fast-track-auth.outputs.authorized == 'true'
              run: |
                  gh pr merge --auto --"$MERGE_METHOD" --match-head-commit "$HEAD_SHA" "$PR_URL"
              env:
                  MERGE_METHOD: ${{ inputs.merge-method }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  PR_URL: ${{ github.event.pull_request.html_url }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # Audit trail: the fast-track path enables auto-merge silently, so
            # record who applied the label, when, and the workflow run on the PR.
            # The applier is the one the authorization step verified, not the
            # event sender. The hidden marker makes this exactly-once: repeated
            # synchronize events find it in an existing comment and skip.
            - name: Fast-track — post audit comment (once)
              id: fast-track-audit
              if: steps.fast-track.conclusion == 'success'
              run: |
                  MARKER='<!-- dependabot-auto-merge:fast-track-audit -->'

                  if gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
                      --jq '.[].body' | grep -qF "$MARKER"; then
                      echo "Fast-track audit comment already exists — skipping."
                      exit 0
                  fi

                  TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

                  BODY=$(cat <<EOF
                  $MARKER
                  **Fast-track audit** — auto-merge was enabled on this PR via the **$FAST_TRACK_LABEL** label, bypassing all gates.

                  - **Label applied by:** @$APPLIED_BY ($ROLE)
                  - **When (UTC):** $TIMESTAMP
                  - **Workflow run:** $RUN_URL
                  EOF
                  )

                  gh pr comment "$PR_URL" --body "$BODY"
              env:
                  APPLIED_BY: ${{ steps.fast-track-auth.outputs.applied-by }}
                  ROLE: ${{ steps.fast-track-auth.outputs.role }}
                  FAST_TRACK_LABEL: ${{ inputs.fast-track-label }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  PR_URL: ${{ github.event.pull_request.html_url }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # Gate 1: must be a security advisory, not a routine version bump.
            # fetch-metadata's alert lookup matches the first updated
            # dependency's previous version to an alert on its manifest. That
            # can succeed for a direct or an indirect dependency, and fail for
            # either, so an empty ghsa-id says nothing about which one this PR
            # updates. Gate 3 reads dependency-type for that instead.
            # The score is classified here as well: a zero-like or unparseable
            # CVSS means GitHub sent no real severity, and `cvss-usable=false`
            # tells the fallback to try the alerts API for a real one.
            - name: Gate 1 — security advisory check
              id: gate1
              if: steps.fast-track.conclusion == 'skipped'
              # Explicit so the step runs under `-e -o pipefail` and the bats
              # suite can drive the extracted script with exactly these flags.
              shell: bash
              run: |
                  # Textually identical to the copy in "Resolve effective
                  # CVSS" — a bats test diffs the two. Steps cannot share
                  # functions, and callers never check this repo out, so the
                  # duplication is the price of keeping the scripts inline.
                  is_unusable() {
                      [[ $1 =~ ^[0-9]*\.?[0-9]+$ ]] || return 0
                      [[ $1 =~ ^0*\.?0*$ ]] && return 0
                      [ "$(echo "$1 > 10" | bc -l)" = "1" ]
                  }

                  if [ -z "$GHSA_ID" ]; then
                      echo "pass=false" >> "$GITHUB_OUTPUT"
                      echo "No GHSA ID from PR metadata — checking Dependabot alerts API."
                  else
                      echo "pass=true" >> "$GITHUB_OUTPUT"
                      echo "cvss=$CVSS" >> "$GITHUB_OUTPUT"
                      if is_unusable "$CVSS"; then
                          echo "cvss-usable=false" >> "$GITHUB_OUTPUT"
                          echo "Advisory $GHSA_ID reported an unusable CVSS ('$CVSS') — checking Dependabot alerts API for a real score."
                      else
                          echo "cvss-usable=true" >> "$GITHUB_OUTPUT"
                      fi
                  fi
              env:
                  GHSA_ID: ${{ steps.meta.outputs.ghsa-id }}
                  CVSS: ${{ steps.meta.outputs.cvss }}

            # Gate 1 fallback: query the Dependabot alerts API and match open
            # alerts against the dependencies being updated. Runs when PR
            # metadata named no advisory (the lookup only examines the first
            # dependency, and only by its previous version), and when it
            # named one with an unusable CVSS, since the API may hold a real
            # score for the same advisory. On that second path the match is
            # narrowed to that advisory as well. A package can carry several
            # open alerts, and a score borrowed from a vulnerability this PR
            # does not fix would pass Gate 2 on the wrong evidence.
            #
            # The two paths also fail differently. With no advisory named, the
            # API is the only advisory source, so an API error fails the job.
            # With one named it is a best-effort enrichment, so an error
            # (a transient failure, typically, since the metadata lookup
            # already read alerts with the same token) degrades to "no better
            # score available" and the resolver fails closed to review
            # routing, as it did before this call existed.
            - name: Gate 1 fallback — Dependabot alerts API
              id: gate1-fallback
              if: |
                  steps.fast-track.conclusion == 'skipped' &&
                  (steps.gate1.outputs.pass == 'false' || steps.gate1.outputs.cvss-usable == 'false')
              # Explicit so the step runs under `-e -o pipefail` and the bats
              # suite can drive the extracted script with exactly these flags.
              shell: bash
              run: |
                  # An alert applies to this PR only when it agrees with one
                  # updated dependency on all four of package name, ecosystem,
                  # manifest directory and fixed version. A name alone let an
                  # alert qualify for a same-named package in another
                  # ecosystem, for a manifest the PR does not touch, or for a
                  # vulnerability the new version leaves in place. Each entry of
                  # updated-dependencies-json carries its own name, ecosystem,
                  # directory and new version. The top-level outputs describe
                  # the first dependency only.
                  #
                  # Ecosystem. fetch-metadata reports Dependabot's package
                  # manager name (npm_and_yarn, go_modules), the alerts API
                  # the advisory database ecosystem (npm, go). A manager with
                  # no advisory database ecosystem maps to nothing and never
                  # matches.
                  #
                  # Directory. The manifest has to sit directly in the updated
                  # directory. A prefix match would let `/` claim every
                  # manifest in the repository. GitHub Actions is the one
                  # exception, where Dependabot reads a directory's workflows
                  # from its `.github/workflows`.
                  #
                  # Version. Ecosystems order pre-releases and qualifiers
                  # differently (semver, PEP 440 and Maven all disagree), so
                  # only plain dotted numbers are compared, numerically, with a
                  # missing component counting as zero. Anything else, or an
                  # advisory with no patched release, cannot be decided here
                  # and does not match, so the PR is never auto-merged on an
                  # alert its new version may not fix.
                  #
                  # $ghsa is empty when PR metadata named no advisory, and any
                  # applicable alert is the only evidence there is. When it
                  # named one, $ghsa pins the match to that advisory, leaving
                  # `sort_by` to pick its best-scored record.
                  #
                  # Split API call and jq into separate stages so each failure
                  # mode surfaces as a named warning rather than a silent exit-1.
                  if API_RESPONSE=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/dependabot/alerts?state=open&per_page=100" 2>&1); then
                      RESULT=$(echo "$API_RESPONSE" | jq -c \
                          --argjson deps "$UPDATED_DEPENDENCIES" \
                          --arg ghsa "$GHSA_ID" \
                          'def alerts_ecosystem:
                               if type == "string" then
                                   {npm_and_yarn: "npm", bun: "npm", bundler: "rubygems",
                                    pip: "pip", uv: "pip", composer: "composer",
                                    go_modules: "go", maven: "maven", gradle: "maven",
                                    sbt: "maven", nuget: "nuget", cargo: "rust",
                                    hex: "erlang", pub: "pub", github_actions: "actions",
                                    swift: "swift"}[.]
                               else null end;
                           def trim_slashes: sub("^/+"; "") | sub("/+$"; "");
                           def in_directory($dir; $manager):
                               if type == "string" and . != "" and ($dir | type) == "string" then
                                   (trim_slashes | split("/") | .[:-1] | join("/")) as $parent
                                   | ($dir | trim_slashes) as $want
                                   | $parent == $want
                                     or ($manager == "github_actions"
                                         and $parent == ([$want, ".github/workflows"]
                                                         | map(select(. != "")) | join("/")))
                               else false end;
                           def version_parts:
                               if type == "string" and test("^v?[0-9]{1,15}([.][0-9]{1,15})*$")
                               then ltrimstr("v") | split(".") | map(tonumber)
                               else null end;
                           def fixed_by($new; $patched):
                               ($new | version_parts) as $n
                               | ($patched | version_parts) as $p
                               | if $n == null or $p == null then false
                                 else ([$n, $p] | map(length) | max) as $len
                                   | ($n + [range($len - ($n | length)) | 0])
                                     >= ($p + [range($len - ($p | length)) | 0])
                                 end;
                           def applies($dep):
                               ($dep.packageEcosystem | alerts_ecosystem) as $eco
                               | .dependency.package.name == $dep.dependencyName
                                 and $eco != null
                                 and .dependency.package.ecosystem == $eco
                                 and (.dependency.manifest_path
                                      | in_directory($dep.directory; $dep.packageEcosystem))
                                 and fixed_by($dep.newVersion;
                                              .security_vulnerability.first_patched_version.identifier);
                           if ($deps | type) != "array" then
                               error("updated-dependencies-json is not an array")
                           else . end
                           | [.[][] | select(.security_advisory.ghsa_id != null)
                              | select($ghsa == "" or .security_advisory.ghsa_id == $ghsa)] as $open
                           | {named: ([$open[] | .dependency.package.name as $n
                                       | select(any($deps[]; .dependencyName == $n))] | length),
                              best: ([$open[] | select(. as $alert | any($deps[]; . as $dep | $alert | applies($dep)))]
                                     | sort_by(-(.security_advisory.cvss.score // 0)) | first
                                     | if . == null then null
                                       else {ghsa: .security_advisory.ghsa_id,
                                             cvss: (.security_advisory.cvss.score // 0)} end)}' 2>&1) || {
                          echo "::warning::Gate 1 fallback: could not match the Dependabot alerts response against updated-dependencies-json, so treating it as no advisory match. $(echo "$RESULT" | head -c 300 | tr '\n' ' ')"
                          RESULT=""
                      }
                  elif [ "$GATE1_PASS" = "true" ]; then
                      # cvss stays empty, never 0 — the review comment names
                      # the reported value, and nothing was reported here.
                      echo "::warning::Gate 1 fallback: Dependabot alerts API call failed — no better score available. $(echo "$API_RESPONSE" | head -c 300 | tr '\n' ' ')"
                      echo "pass=false" >> "$GITHUB_OUTPUT"
                      echo "cvss=" >> "$GITHUB_OUTPUT"
                      exit 0
                  else
                      echo "::error::Gate 1 fallback: Dependabot alerts API call failed — $(echo "$API_RESPONSE" | head -c 300 | tr '\n' ' ')"
                      exit 1
                  fi

                  BEST=""
                  NAMED=0
                  if [ -n "$RESULT" ]; then
                      BEST=$(echo "$RESULT" | jq -c '.best // empty')
                      NAMED=$(echo "$RESULT" | jq -r '.named')
                  fi

                  if [ -z "$BEST" ]; then
                      echo "pass=false" >> "$GITHUB_OUTPUT"
                      echo "cvss=" >> "$GITHUB_OUTPUT"
                      # Name the near misses. An alert rejected on ecosystem,
                      # directory or version is the first thing to check when
                      # a real security PR lands here.
                      if [ "$NAMED" != "0" ]; then
                          echo "$NAMED open Dependabot alert(s) name an updated package but do not apply to it (ecosystem, manifest directory, or a version the step cannot confirm is fixed)."
                      fi
                      if [ "$GATE1_PASS" = "true" ]; then
                          echo "No applicable open Dependabot alert found, so no better score available."
                      else
                          echo "No applicable open Dependabot alert found, so this is a routine version update."
                      fi
                  else
                      GHSA=$(echo "$BEST" | jq -r '.ghsa')
                      CVSS=$(echo "$BEST" | jq -r '.cvss')
                      echo "pass=true" >> "$GITHUB_OUTPUT"
                      echo "cvss=$CVSS" >> "$GITHUB_OUTPUT"
                      echo "Advisory $GHSA (CVSS $CVSS) found via Dependabot alerts API."
                  fi
              env:
                  UPDATED_DEPENDENCIES: ${{ steps.meta.outputs.updated-dependencies-json }}
                  GHSA_ID: ${{ steps.meta.outputs.ghsa-id }}
                  GATE1_PASS: ${{ steps.gate1.outputs.pass }}
                  GH_TOKEN: ${{ secrets.token || github.token }}

            # Resolve the effective CVSS from whichever source succeeded, and
            # decide in the same place whether that score is usable at all.
            # GitHub reports 0.0 for advisories that carry no CVSS v3 vector,
            # so a zero-like score means "no metadata", not "harmless" — fail
            # closed instead of letting Gate 2 call it a below-threshold score.
            - name: Resolve effective CVSS
              id: cvss
              if: |
                  steps.fast-track.conclusion == 'skipped' &&
                  (steps.gate1.outputs.pass == 'true' || steps.gate1-fallback.outputs.pass == 'true')
              # Explicit so the step runs under `-e -o pipefail` (the bare
              # default is `bash -e` only) and the bats suite can drive the
              # extracted script with exactly these flags.
              shell: bash
              run: |
                  # A usable score is a plain decimal inside the CVSS range.
                  # Empty, non-numeric, any spelling of zero (0, 0.0, 00, .00)
                  # and anything above 10 all mean GitHub gave us no real
                  # severity, so every one of them fails closed. Without the
                  # range check an implausible score would fail *open* through
                  # Gate 2 while a zero fails closed — opposite ways to be wrong.
                  is_unusable() {
                      [[ $1 =~ ^[0-9]*\.?[0-9]+$ ]] || return 0
                      [[ $1 =~ ^0*\.?0*$ ]] && return 0
                      [ "$(echo "$1 > 10" | bc -l)" = "1" ]
                  }

                  # Both sources can be populated: the fallback also runs when
                  # Gate 1 passed with an unusable score, to recover a real
                  # one from the alerts API. Gate 1's value wins when usable;
                  # REPORTED keeps whichever value GitHub sent first, so the
                  # review comment can name it even when it is too broken to
                  # gate on.
                  REPORTED="${GATE1_CVSS:-$GATE1_FALLBACK_CVSS}"

                  CVSS="$GATE1_CVSS"
                  if is_unusable "$CVSS"; then
                      CVSS="$GATE1_FALLBACK_CVSS"
                  fi

                  # Heredoc form: unusable values reach $GITHUB_OUTPUT verbatim,
                  # and a bare key=value would break on one containing a newline.
                  # The delimiter is generated per run — a value holding a fixed
                  # delimiter as a literal line would close the block early and
                  # leave output the runner rejects, failing the very step that
                  # exists to fail closed.
                  DELIM="EOF_$(openssl rand -hex 8)"
                  {
                      echo "value<<$DELIM"
                      echo "$CVSS"
                      echo "$DELIM"
                      echo "reported<<$DELIM"
                      echo "$REPORTED"
                      echo "$DELIM"
                  } >> "$GITHUB_OUTPUT"

                  if is_unusable "$CVSS"; then
                      echo "available=false" >> "$GITHUB_OUTPUT"
                      echo "Neither PR metadata nor the alerts API returned a usable CVSS (got '$REPORTED') — failing closed."
                  else
                      echo "available=true" >> "$GITHUB_OUTPUT"
                      echo "Effective CVSS: $CVSS"
                  fi
              env:
                  GATE1_CVSS: ${{ steps.gate1.outputs.cvss }}
                  GATE1_FALLBACK_CVSS: ${{ steps.gate1-fallback.outputs.cvss }}

            # Gate 2: high or critical severity.
            - name: Gate 2 — severity check (CVSS ≥ ${{ inputs.cvss-threshold }})
              id: gate2
              if: |
                  steps.fast-track.conclusion == 'skipped' &&
                  steps.cvss.outputs.available == 'true'
              run: |
                  if (( $(echo "$CVSS >= $THRESHOLD" | bc -l) )); then
                      echo "pass=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "pass=false" >> "$GITHUB_OUTPUT"
                      echo "CVSS $CVSS is below the threshold of $THRESHOLD."
                  fi
              env:
                  CVSS: ${{ steps.cvss.outputs.value }}
                  THRESHOLD: ${{ inputs.cvss-threshold }}

            # Gate 3: compatibility score, for direct dependencies.
            # Runs for every PR that clears Gate 2 and decides inside the
            # script whether the check applies, from dependency-type. Which
            # Gate 1 path found the advisory says nothing about that, because
            # the alert lookup can name an advisory for an indirect dependency
            # and miss one for a direct dependency. Skipping the step instead
            # would count as a pass for the pending label, so an `if:` that
            # wrongly skips it fails open.
            - name: Gate 3 — compatibility score (≥ ${{ inputs.compatibility-threshold }}%)
              id: gate3
              if: |
                  steps.fast-track.conclusion == 'skipped' &&
                  steps.gate2.outputs.pass == 'true'
              # Explicit so the step runs under `-e -o pipefail` and the bats
              # suite can drive the extracted script with exactly these flags.
              shell: bash
              run: |
                  # fetch-metadata sets dependency-type to the most direct type
                  # across all updated dependencies, ranked direct:production,
                  # direct:development, indirect. So `indirect` means nothing
                  # in the PR is direct. Everything else gets the check,
                  # `unknown` and empty included, because failing to classify a
                  # PR must not be a way around the gate. fetch-metadata cannot
                  # score transitive dependencies, and the age gate is their
                  # timing safeguard.
                  if [ "$DEPENDENCY_TYPE" = "indirect" ]; then
                      echo "pass=true" >> "$GITHUB_OUTPUT"
                      echo "Indirect dependencies only, so the compatibility check does not apply."
                      exit 0
                  fi

                  # Every direct dependency needs its own usable score, and the
                  # lowest one gates the PR. The top-level compatibility-score
                  # output describes the first dependency only. A usable score
                  # is a whole number from 1 to 100. fetch-metadata writes 0
                  # both when the lookup is off and when Dependabot has no score
                  # for the update, so 0 is missing data, not a 0% score, and
                  # fails closed to review the way an unusable CVSS does.
                  if ! RESULT=$(jq -c --argjson threshold "$THRESHOLD" '
                      if type != "array" then error("updated-dependencies-json is not an array") else . end
                      | [.[] | select(.dependencyType != "indirect")
                         | {name: .dependencyName,
                            score: .compatScore,
                            usable: ((.compatScore | type) == "number"
                                     and .compatScore == (.compatScore | floor)
                                     and .compatScore >= 1 and .compatScore <= 100)}] as $direct
                      | if ($direct | length) == 0 then {available: false, dependency: ""}
                        elif any($direct[]; .usable | not) then
                            {available: false,
                             dependency: (first($direct[] | select(.usable | not)) | .name)}
                        else ($direct | min_by(.score)) as $low
                            | {available: true, dependency: $low.name, score: $low.score,
                               pass: ($low.score >= $threshold)}
                        end' <<<"$UPDATED_DEPENDENCIES" 2>&1) || [ -z "$RESULT" ]; then
                      echo "::warning::Gate 3: could not read updated-dependencies-json, so no compatibility score is available. $(echo "$RESULT" | head -c 300 | tr '\n' ' ')"
                      RESULT='{"available": false, "dependency": ""}'
                  fi

                  # Newlines are stripped because the name goes to $GITHUB_OUTPUT,
                  # where one would start a new output line.
                  AVAILABLE=$(jq -r '.available' <<<"$RESULT")
                  DEPENDENCY=$(jq -r '.dependency // ""' <<<"$RESULT" | tr -d '\r\n')
                  echo "available=$AVAILABLE" >> "$GITHUB_OUTPUT"
                  echo "dependency=$DEPENDENCY" >> "$GITHUB_OUTPUT"

                  if [ "$AVAILABLE" != "true" ]; then
                      echo "pass=false" >> "$GITHUB_OUTPUT"
                      echo "No usable compatibility score for ${DEPENDENCY:-the updated dependencies}, failing closed."
                      exit 0
                  fi

                  SCORE=$(jq -r '.score' <<<"$RESULT")
                  echo "score=$SCORE" >> "$GITHUB_OUTPUT"
                  if [ "$(jq -r '.pass' <<<"$RESULT")" = "true" ]; then
                      echo "pass=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "pass=false" >> "$GITHUB_OUTPUT"
                      echo "Compatibility score $SCORE for $DEPENDENCY is below $THRESHOLD%."
                  fi
              env:
                  DEPENDENCY_TYPE: ${{ steps.meta.outputs.dependency-type }}
                  UPDATED_DEPENDENCIES: ${{ steps.meta.outputs.updated-dependencies-json }}
                  THRESHOLD: ${{ inputs.compatibility-threshold }}

            # Metadata unavailable or gates 2/3 failed — label for human
            # review. The review and pending labels are mutually exclusive
            # states, so taking one always sheds the other.
            - name: Label — ${{ inputs.review-label }}
              id: label-review
              if: |
                  steps.fast-track.conclusion == 'skipped' &&
                  (steps.gate1.outputs.pass == 'true' || steps.gate1-fallback.outputs.pass == 'true') &&
                  (steps.cvss.outputs.available == 'false' ||
                   steps.gate2.outputs.pass == 'false' ||
                   steps.gate3.outputs.pass == 'false')
              run: |
                  if [ "$METADATA_AVAILABLE" == "false" ]; then
                      REASON="advisory metadata (CVSS) was unavailable — failing closed"
                      # REPORTED_CVSS, not CVSS: an unusable score never
                      # becomes the effective value, so only the reported one
                      # can name what GitHub actually sent.
                      if [ -n "$REPORTED_CVSS" ]; then
                          REASON="$REASON (GitHub reported a CVSS of \`$REPORTED_CVSS\`, which carries no severity information)"
                      fi
                  elif [ "$GATE2_PASS" == "false" ]; then
                      REASON="CVSS score ($CVSS) is below the threshold of $THRESHOLD"
                  elif [ "$GATE3_AVAILABLE" == "false" ]; then
                      # A missing score gets its own reason. fetch-metadata
                      # reports it as 0, which would otherwise read as a real
                      # 0% below the threshold.
                      REASON="the compatibility score for ${COMPAT_DEPENDENCY:-the updated dependencies} was unavailable, failing closed"
                  else
                      REASON="compatibility score for $COMPAT_DEPENDENCY ($COMPAT_SCORE%) is below the required $COMPAT_THRESHOLD%"
                  fi
                  TEAM_MENTION=""
                  if [ -n "$REVIEW_TEAM" ]; then
                      TEAM_MENTION=" cc @$REVIEW_TEAM"
                  fi
                  # Comment before labelling. Under `bash -e` a failed edit
                  # aborts the step, and the reviewer notification is the part
                  # a human still needs when that happens.
                  gh pr comment "$PR_URL" --body "This PR has been routed to the security-review path: $REASON.$TEAM_MENTION"
                  # One `gh pr edit` rather than two calls, though not one
                  # atomic call. gh sends the add and the remove as two
                  # concurrent mutations with no rollback, so a failure on the
                  # remove half can still leave both labels on. The invariant
                  # survives that. The cron excludes any PR carrying the review
                  # label, and the next evaluation to reach a verdict clears
                  # the both-labels state.
                  gh pr edit "$PR_URL" --add-label "$REVIEW_LABEL" --remove-label "$PENDING_LABEL"
              env:
                  METADATA_AVAILABLE: ${{ steps.cvss.outputs.available }}
                  GATE2_PASS: ${{ steps.gate2.outputs.pass }}
                  CVSS: ${{ steps.cvss.outputs.value }}
                  REPORTED_CVSS: ${{ steps.cvss.outputs.reported }}
                  THRESHOLD: ${{ inputs.cvss-threshold }}
                  GATE3_AVAILABLE: ${{ steps.gate3.outputs.available }}
                  COMPAT_SCORE: ${{ steps.gate3.outputs.score }}
                  COMPAT_DEPENDENCY: ${{ steps.gate3.outputs.dependency }}
                  COMPAT_THRESHOLD: ${{ inputs.compatibility-threshold }}
                  REVIEW_TEAM: ${{ inputs.review-team }}
                  REVIEW_LABEL: ${{ inputs.review-label }}
                  PENDING_LABEL: ${{ inputs.pending-label }}
                  PR_URL: ${{ github.event.pull_request.html_url }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # All gates cleared — label as pending for the scheduled age-gate
            # check, shedding any review label from an earlier failing run.
            # The step also runs when the pending label is already present but
            # the review label still lingers: skipping there would strand the
            # exact both-labels state this step exists to clear.
            # Gate 3 runs whenever Gate 2 passes, so only its own pass counts
            # here. A skipped Gate 3 is never read as a passed one.
            - name: Label — ${{ inputs.pending-label }} (awaiting age gate)
              id: label-pending
              if: |
                  steps.fast-track.conclusion == 'skipped' &&
                  steps.gate2.outputs.pass == 'true' &&
                  steps.gate3.outputs.pass == 'true' &&
                  (!contains(github.event.pull_request.labels.*.name, inputs.pending-label) ||
                   contains(github.event.pull_request.labels.*.name, inputs.review-label))
              run: |
                  gh pr edit "$PR_URL" --add-label "$PENDING_LABEL" --remove-label "$REVIEW_LABEL"
              env:
                  PENDING_LABEL: ${{ inputs.pending-label }}
                  REVIEW_LABEL: ${{ inputs.review-label }}
                  PR_URL: ${{ github.event.pull_request.html_url }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # Record the verdict as evidence the scheduled merge can trust.
            # The pending label cannot be that evidence, because a triage
            # user can apply it, or remove the review label, and evaluation
            # never touches the labels of a routine update. A commit status
            # is bound to the head commit evaluated here, and creating one
            # takes statuses: write, which a triage user does not have.
            #
            # A pass writes success. Anything else, including an evaluation
            # that errored before Gate 2 reported, writes failure, but only
            # over a success an earlier run recorded for this same commit:
            # failing every ineligible commit would put a red status on
            # every routine Dependabot PR. always() so that an errored run
            # still withdraws. A fast-tracked PR is left alone, as its
            # auto-merge is already queued.
            - name: Record eligibility evidence on the head commit
              id: record-eligibility
              if: always() && steps.fast-track.conclusion != 'success'
              # Explicit so the step runs under `-e -o pipefail` and the bats
              # suite can drive the extracted script with exactly these flags.
              shell: bash
              run: |
                  CONTEXT='dependabot-auto-merge/eligibility'
                  # The creator GitHub records for a status written with a
                  # GITHUB_TOKEN. Readers ignore statuses from anyone else.
                  CREATOR='github-actions[bot]'

                  post_status() {
                      gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
                          -f state="$1" -f context="$CONTEXT" \
                          -f description="$2" -f target_url="$RUN_URL" >/dev/null
                  }

                  # The verdict is also an output, so revoke-auto-merge acts on
                  # the same decision instead of re-deriving it. Gate 3 runs
                  # for every PR that clears Gate 2, so only its own pass
                  # counts. A skipped Gate 3 is never read as a passed one.
                  if [ "$GATE2_PASS" = "true" ] && [ "$GATE3_PASS" = "true" ]; then
                      post_status success "Passed the auto-merge gates at this commit"
                      echo "eligible=true" >> "$GITHUB_OUTPUT"
                      echo "Recorded eligibility for $HEAD_SHA."
                      exit 0
                  fi
                  echo "eligible=false" >> "$GITHUB_OUTPUT"

                  if STATUSES=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/statuses?per_page=100" 2>&1) &&
                      LATEST=$(echo "$STATUSES" | jq -r --arg context "$CONTEXT" --arg creator "$CREATOR" \
                          '[.[][] | select(.context == $context and .creator.login == $creator)] | first | .state // ""' 2>&1); then
                      if [ "$LATEST" != "success" ]; then
                          echo "Not eligible, and no eligibility evidence to withdraw for $HEAD_SHA."
                          exit 0
                      fi
                      echo "Not eligible. Withdrawing the eligibility an earlier evaluation recorded for $HEAD_SHA."
                  else
                      echo "::warning::Cannot read existing statuses for $HEAD_SHA, so recording ineligibility in case earlier evidence exists. $(echo "$STATUSES" | head -c 300 | tr '\n' ' ')"
                  fi
                  post_status failure "Not eligible for auto-merge at this commit"
              env:
                  GATE2_PASS: ${{ steps.gate2.outputs.pass }}
                  GATE3_PASS: ${{ steps.gate3.outputs.pass }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # Withdraw an auto-merge this workflow queued once the latest
            # evaluation no longer supports it. Review routing and label
            # removal only change labels, and a queued auto-merge would
            # otherwise merge the PR anyway. GitHub disables auto-merge on
            # some head changes, but not reliably enough to count on.
            #
            # A queued auto-merge stands only when the PR clears the gates
            # and the age gate, which is what the scheduled merge would
            # queue anyway. An authorized fast-track skips this step. Every
            # other verdict disables it, including a young PR that passes
            # the gates but has lost its override, and a run that errored
            # before a verdict. An auto-merge a person enabled is left
            # alone: only users with write access can do that, so it is
            # their authorization, not this workflow's.
            #
            # Runs after record-eligibility on purpose. Evidence goes first,
            # and the scheduled merge re-checks evidence after it queues,
            # so neither order of the two jobs leaves a merge queued.
            - name: Revoke a queued auto-merge the evaluation no longer supports
              id: revoke-auto-merge
              if: always() && steps.fast-track.conclusion != 'success'
              # Explicit so the step runs under `-e -o pipefail` and the bats
              # suite can drive the extracted script with exactly these flags.
              shell: bash
              run: |
                  # The login the merge steps enable auto-merge as.
                  BOT='github-actions[bot]'

                  # ELIGIBLE is record-eligibility's verdict. Anything but
                  # true, including no output from a step that never ran,
                  # counts as not eligible.
                  AGED=$(jq -n --arg created "$PR_CREATED_AT" --argjson age "$AGE_DAYS" \
                      '((now - ($created | fromdateiso8601)) / 86400) >= $age' 2>/dev/null || echo false)

                  if [ "$ELIGIBLE" = "true" ] && [ "$AGED" = "true" ]; then
                      echo "The PR clears the gates and the age gate, so a queued auto-merge stands."
                      exit 0
                  fi

                  if [ "$ELIGIBLE" = "true" ]; then
                      REASON="it passes the gates but has not cleared the $AGE_DAYS-day age gate, and no authorized fast-track label covers it"
                  else
                      REASON="the latest evaluation did not pass the gates"
                  fi

                  # Empty means nothing is queued. A queued merge with no
                  # readable enabler is treated as this workflow's.
                  if PR_JSON=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" 2>&1) &&
                      ENABLED_BY=$(echo "$PR_JSON" | jq -r \
                          'if .auto_merge == null then "" else (.auto_merge.enabled_by.login // "?") end' 2>&1); then
                      if [ -z "$ENABLED_BY" ]; then
                          echo "No auto-merge is queued on PR #$PR_NUMBER."
                          exit 0
                      fi
                      if [ "$ENABLED_BY" != "$BOT" ] && [ "$ENABLED_BY" != "?" ]; then
                          echo "Auto-merge on PR #$PR_NUMBER was enabled by @$ENABLED_BY, not this workflow, so it stays."
                          exit 0
                      fi
                  else
                      echo "::warning::Cannot read the auto-merge state of PR #$PR_NUMBER, so disabling it in case this workflow queued it. $(echo "$PR_JSON" | head -c 300 | tr '\n' ' ')"
                  fi

                  gh pr merge --disable-auto "$PR_URL"
                  echo "Disabled the queued auto-merge on PR #$PR_NUMBER because $REASON."
                  gh pr comment "$PR_URL" --body "Auto-merge was disabled on this PR because $REASON. Evaluated commit: \`$HEAD_SHA\`. Workflow run: $RUN_URL"
              env:
                  ELIGIBLE: ${{ steps.record-eligibility.outputs.eligible }}
                  PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
                  AGE_DAYS: ${{ inputs.age-days }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  PR_URL: ${{ github.event.pull_request.html_url }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # Labeling step failed — notify so the failure doesn't go unnoticed.
            - name: Notify on labeling failure
              if: failure()
              run: |
                  echo "Workflow failed for PR $PR_URL"
              env:
                  PR_URL: ${{ github.event.pull_request.html_url }}

    # Runs daily. Finds PRs labelled with the pending label that have cleared
    # the age gate and enables auto-merge on them. PRs also carrying the
    # review label are excluded: a stale pending label from before a PR was
    # routed to review must never keep it in the merge set.
    #
    # The labels only pick candidates. A triage user can apply the pending
    # label, so each candidate merges only when its current head commit
    # carries the success status evaluate-pr records on a pass.
    scheduled-merge:
        name: Scheduled merge of eligible PRs
        runs-on: ubuntu-latest
        needs: preflight
        if: inputs.event-name == 'schedule'
        steps:
            - name: Merge PRs past age gate
              id: scheduled-merge
              run: |
                  # Collect PR numbers first, then iterate in the main shell: a
                  # piped `while read` runs in a subshell, where FAILED would be
                  # lost and every merge failure silently reported as success.
                  # The review-label exclusion is a jq post-filter rather than
                  # a `--search "-label:..."` qualifier: search rides an
                  # eventually-consistent index, and a PR labelled for review
                  # minutes before the cron fires must not slip through.
                  # The comparison is case-insensitive, as every other label
                  # comparison in the chain is. Actions `contains()`, `gh pr
                  # edit` and `gh pr list --label` all ignore case, so a
                  # caller whose `review-label` input differs in case from the
                  # repository label still gets the PR excluded here.
                  CANDIDATES=$(gh pr list \
                      --repo "$GITHUB_REPOSITORY" \
                      --author "app/dependabot" \
                      --label "$PENDING_LABEL" \
                      --state open \
                      --json number,createdAt,labels,headRefOid \
                  | jq -r --argjson age "$AGE_DAYS" --arg review "$REVIEW_LABEL" \
                      '.[]
                       | select([.labels[].name | ascii_downcase]
                                | index($review | ascii_downcase) | not)
                       | select(((now - (.createdAt | fromdateiso8601)) / 86400) >= $age)
                       | "\(.number) \(.headRefOid)"')

                  # Must match what the record-eligibility step writes.
                  CONTEXT='dependabot-auto-merge/eligibility'
                  CREATOR='github-actions[bot]'

                  # Set STATE to the latest eligibility verdict recorded for
                  # commit $1, empty when there is none. Statuses come newest
                  # first, so the first match is the latest. Returns non-zero,
                  # with the error in STATE, when the lookup fails.
                  evidence_state() {
                      local statuses
                      if ! statuses=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/commits/$1/statuses?per_page=100" 2>&1); then
                          STATE=$statuses
                          return 1
                      fi
                      STATE=$(echo "$statuses" | jq -r --arg context "$CONTEXT" --arg creator "$CREATOR" \
                          '[.[][] | select(.context == $context and .creator.login == $creator)] | first | .state // ""' 2>&1)
                  }

                  FAILED=0
                  while read -r PR_NUM HEAD_SHA <&3; do
                      [ -n "$PR_NUM" ] || continue

                      # Evidence for an earlier head does not count: the
                      # lookup is by the head commit as listed now. A failed
                      # lookup blocks the merge and fails the job, as a failed
                      # merge does. Missing or withdrawn evidence only skips
                      # the PR, since that is the answer, not an error.
                      if ! evidence_state "$HEAD_SHA"; then
                          echo "::error::Cannot verify eligibility evidence for PR #$PR_NUM at $HEAD_SHA, so it was not merged. $(echo "$STATE" | head -c 500 | tr '\n' ' ')"
                          FAILED=1
                          continue
                      fi
                      if [ "$STATE" != "success" ]; then
                          echo "::warning::Skipping PR #$PR_NUM. Its head commit $HEAD_SHA has no passing evaluation (latest recorded state: ${STATE:-none}). A pending label is not enough on its own. Any new PR event re-evaluates it."
                          continue
                      fi

                      # Pinned to the commit whose evidence was just checked,
                      # so a push since then makes GitHub refuse the merge.
                      echo "Enabling auto-merge on PR #$PR_NUM"
                      if ! ERR=$(gh pr merge "$PR_NUM" --auto --"$MERGE_METHOD" --match-head-commit "$HEAD_SHA" --repo "$GITHUB_REPOSITORY" 2>&1 >/dev/null); then
                          echo "::error::Failed to enable auto-merge on PR #$PR_NUM — $(echo "$ERR" | head -c 500 | tr '\n' ' ')"
                          FAILED=1
                          continue
                      fi

                      # An evaluation can withdraw the evidence and disable
                      # auto-merge between the check above and the merge call,
                      # which would re-queue what it just revoked. Evaluation
                      # withdraws evidence before it disables, so checking
                      # again now catches every such interleaving. A failed
                      # check disables too.
                      if ! evidence_state "$HEAD_SHA" || [ "$STATE" != "success" ]; then
                          echo "::warning::Eligibility evidence for PR #$PR_NUM changed while auto-merge was being enabled, so it was disabled again."
                          if ! ERR=$(gh pr merge "$PR_NUM" --disable-auto --repo "$GITHUB_REPOSITORY" 2>&1 >/dev/null); then
                              echo "::error::Failed to disable auto-merge on PR #$PR_NUM after its evidence was withdrawn. Disable it by hand. $(echo "$ERR" | head -c 500 | tr '\n' ' ')"
                              FAILED=1
                          fi
                      fi
                  done 3<<<"$CANDIDATES"
                  exit $FAILED
              env:
                  PENDING_LABEL: ${{ inputs.pending-label }}
                  REVIEW_LABEL: ${{ inputs.review-label }}
                  AGE_DAYS: ${{ inputs.age-days }}
                  MERGE_METHOD: ${{ inputs.merge-method }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
